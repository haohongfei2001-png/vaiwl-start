name: Home workspace design
on:
  push:
    branches: [codex/free-v1-implementation]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/home-theme.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/home-theme.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-theme-${{ github.ref }}
  cancel-in-progress: true
jobs:
  domain-and-package:
    name: Theme types, unit, privacy and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-theme-package-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          if-no-files-found: error
  browsers:
    name: Installed ${{ matrix.browser }} theme and regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: Chromium
            install: chromium
            channel: ''
            family: chrome
          - browser: Edge
            install: msedge
            channel: msedge
            family: edge
    env:
      VAIWL_BROWSER_CHANNEL: ${{ matrix.channel }}
      VAIWL_TEST_BROWSER_FAMILY: ${{ matrix.family }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Bound browser dependency downloads
        run: |
          # Match the existing task workflow's signed Ubuntu mirror fallback.
          if test -f /etc/apt/apt-mirrors.txt; then
            sudo sed -i 's|https\?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo tee /etc/apt/apt.conf.d/80-vaiwl-downloads > /dev/null <<'APT'
          Acquire::Retries "1";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APT
      - run: npx playwright install --with-deps ${{ matrix.install }}
        timeout-minutes: 5
      - run: sudo apt-get install -y fonts-noto-cjk
        timeout-minutes: 3
      - run: npm run build
        id: build
      - name: Build the preserved design baseline
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          baseline_dir="$RUNNER_TEMP/vaiwl-workspace-before"
          git worktree add --detach "$baseline_dir" 549f1e2794784586326ce114d98abbd3d36e2458
          node --input-type=module - "$baseline_dir" <<'NODE'
          import { mkdirSync, readdirSync, symlinkSync } from 'node:fs';
          import { join, resolve } from 'node:path';
          const target = join(process.argv[2], 'node_modules');
          mkdirSync(target);
          for (const entry of readdirSync('node_modules')) {
            symlinkSync(resolve('node_modules', entry), join(target, entry));
          }
          NODE
          cd "$baseline_dir"
          node scripts/build.mjs
      - name: Five-width design matrix and sparse/dense browser screenshots
        run: node tests/browser/workspace-design.mjs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          VAIWL_WORKSPACE_BASELINE_DIST: ${{ runner.temp }}/vaiwl-workspace-before/dist
      - name: Publish reviewable design screenshots early
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-design-${{ matrix.family }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/workspace-design/
            artifacts/*workspace-design-validation.json
          if-no-files-found: error
      - name: Installed extension theme switching and responsive layouts
        run: node tests/browser/home-theme.mjs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      - name: Installed cross-theme R1–R6 contract
        run: node tests/browser/home-guardrails.mjs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      - name: Existing settings, layout, workspace and bookmark regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for test in task-glance settings-consumer layout-responsive home-workspace life-bookmarks; do
            node "tests/browser/$test.mjs" || failed=1
          done
          exit "$failed"
      - run: npm run audit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      - run: npm run package
        if: ${{ success() }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-theme-${{ matrix.family }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          if-no-files-found: error
