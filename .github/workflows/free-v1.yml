name: Free V1 verification
on:
  push:
    branches: [codex/free-v1-implementation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: free-v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  domain-and-package:
    name: Types, domain, privacy and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vaiwl-start-dev-${{ github.sha }}
          path: |
            artifacts/vaiwl-start-free-v1-*.zip
            artifacts/package.json
            artifacts/privacy-audit.json
            artifacts/unit-validation.json
          if-no-files-found: error
  chromium-extension:
    name: Installed Chromium extension and UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
        id: extension_build
      - run: npm run test:browser
        if: ${{ !cancelled() && steps.extension_build.outcome == 'success' }}
      - run: node tests/browser/import-recovery.mjs
        if: ${{ !cancelled() && steps.extension_build.outcome == 'success' }}
      - run: node tests/browser/automatic-history.mjs
        if: ${{ !cancelled() && steps.extension_build.outcome == 'success' }}
      - run: node tests/browser/privacy-boundaries.mjs
        if: ${{ !cancelled() && steps.extension_build.outcome == 'success' }}
      - run: node tests/browser/source-recovery.mjs
        if: ${{ !cancelled() && steps.extension_build.outcome == 'success' }}
      - run: node tests/browser/project-observation.mjs
        if: ${{ !cancelled() && steps.extension_build.outcome == 'success' }}
      - run: node tests/browser/native-project-grouping.mjs
        if: ${{ !cancelled() && steps.extension_build.outcome == 'success' }}
      - run: node tests/browser/home-workspace.mjs
        if: ${{ !cancelled() && steps.extension_build.outcome == 'success' }}
      - run: node tests/browser/project-startup.mjs
        if: ${{ !cancelled() && steps.extension_build.outcome == 'success' }}
      - run: node tests/browser/storage-faults.mjs
        if: ${{ !cancelled() && steps.extension_build.outcome == 'success' }}
      - run: node tests/ui/production-ui.mjs
        if: ${{ !cancelled() && steps.extension_build.outcome == 'success' }}
      - run: node tests/browser/native-experience.mjs
        if: ${{ !cancelled() && steps.extension_build.outcome == 'success' }}
      - run: node tests/browser/life-bookmarks.mjs
        if: ${{ !cancelled() && steps.extension_build.outcome == 'success' }}
      - run: node tests/browser/upgrade-native.mjs
        if: ${{ !cancelled() && steps.extension_build.outcome == 'success' }}
      - run: node tests/browser/performance.mjs
        if: ${{ !cancelled() && steps.extension_build.outcome == 'success' }}
      - run: npm run audit
      - run: node scripts/acceptance.mjs
      - run: npm run package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vaiwl-start-browser-evidence-${{ github.sha }}
          path: |
            artifacts/browser-validation.json
            artifacts/import-recovery-validation.json
            artifacts/automatic-history-validation.json
            artifacts/automatic-history-baseline-validation.json
            artifacts/privacy-boundaries-validation.json
            artifacts/source-recovery-validation.json
            artifacts/project-observation-validation.json
            artifacts/native-project-grouping-validation.json
            artifacts/project-startup-validation.json
            artifacts/native-project-grouping.png
            artifacts/home-workspace-validation.json
            artifacts/home-workspace/chrome/
            artifacts/storage-faults-validation.json
            artifacts/native-experience-validation.json
            artifacts/life-bookmarks-validation.json
            artifacts/life-bookmarks/chrome/
            artifacts/native-upgrade-validation.json
            artifacts/native-workspace.png
            artifacts/native-settings.png
            artifacts/ui-validation.json
            artifacts/ui-review.png
            artifacts/ui-*-held.png
            artifacts/performance-validation.json
            artifacts/acceptance-matrix.json
            artifacts/unit-validation.json
            artifacts/privacy-audit.json
            artifacts/vaiwl-start-free-v1-*.zip
            artifacts/package.json
          if-no-files-found: error

  edge-life-bookmarks:
    name: Installed Microsoft Edge life modes and bookmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps msedge
      - run: npm run build
        id: extension_build
      - run: node tests/browser/life-bookmarks.mjs
        if: ${{ !cancelled() && steps.extension_build.outcome == 'success' }}
        env:
          VAIWL_BROWSER_CHANNEL: msedge
          VAIWL_TEST_BROWSER_FAMILY: edge
      - run: node tests/browser/home-workspace.mjs
        if: ${{ !cancelled() && steps.extension_build.outcome == 'success' }}
        env:
          VAIWL_BROWSER_CHANNEL: msedge
          VAIWL_TEST_BROWSER_FAMILY: edge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vaiwl-start-edge-life-evidence-${{ github.sha }}
          path: |
            artifacts/edge-life-bookmarks-validation.json
            artifacts/life-bookmarks/edge/
            artifacts/edge-home-workspace-validation.json
            artifacts/home-workspace/edge/
          if-no-files-found: error
